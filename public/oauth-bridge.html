<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>OAuth Bridge</title>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      console.log("OAuth Bridge Loaded");
      console.log("Current URL:", window.location.href);

      const SUPABASE_URL = "https://qhsfxcesuhbpvhquuzod.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoc2Z4Y2VzdWhicHVocXV1em9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIwNzcxNjQsImV4cCI6MjA2NzY1MzE2NH0.fS-T2lJGSpc8OWrOADjrpg8E-ZwX0AcBVxBxnrJ0KbY";

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      (async () => {
        try {
          // Parse session from URL hash and store it locally
          const { data, error } = await supabaseClient.auth.getSessionFromUrl({
            storeSession: true,
          });

          if (error) {
            console.error("Error in getSessionFromUrl:", error);
            return;
          }

          console.log("Session from URL:", data.session);

          // Confirm session stored successfully
          const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

          if (sessionError) {
            console.error("Error getting session:", sessionError);
            return;
          }

          if (session) {
            console.log("Session stored successfully:", session);
            // Redirect to home or app main page
            window.location.href = "/";
          } else {
            console.log("No active session found after parsing URL.");
          }
        } catch (err) {
          console.error("Unexpected error:", err);
        }
      })();
    </script>
  </body>
</html>
