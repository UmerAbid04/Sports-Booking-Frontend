<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OAuth Bridge</title>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (async () => {
    const SUPABASE_URL = "https://qhsfxcesuhbpvhquuzod.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoc2Z4Y2VzdWhicHZocXF1em9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIwNzcxNjQsImV4cCI6MjA2NzY1MzE2NH0.fS-T2lJGSpc8OWrOADjrpg8E-ZwX0AcBVxBxnrJ0KbY";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    try {
      // 1️⃣ Exchange OAuth "code" for a session
      const { data: exchangeData, error: exchangeError } = await supabase.auth.exchangeCodeForSession(window.location.href);
      if (exchangeError) {
        console.error("Exchange error:", exchangeError);
        window.location.href = "/login";
        return;
      }

      // 2️⃣ Get the active session
      const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
      if (sessionError || !sessionData.session) {
        console.error("Session error:", sessionError);
        window.location.href = "/login";
        return;
      }

      const session = sessionData.session;

      // 3️⃣ Save token & user info
      localStorage.setItem("authToken", session.access_token);
      localStorage.setItem("currentUser", JSON.stringify(session.user));

      // 4️⃣ Redirect to home (or dashboard)
      window.location.href = "/";
    } catch (err) {
      console.error("Unexpected error:", err);
      window.location.href = "/login";
    }
  })();
</script>
</body>
</html>
