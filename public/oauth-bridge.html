<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OAuth Bridge</title>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (async () => {
    const SUPABASE_URL = "https://qhsfxcesuhbpvhquuzod.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoc2Z4Y2VzdWhicHZocXF1em9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIwNzcxNjQsImV4cCI6MjA2NzY1MzE2NH0.fS-T2lJGSpc8OWrOADjrpg8E-ZwX0AcBVxBxnrJ0KbY";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Capture session from the URL after redirect
    const { data: { session }, error } = await supabase.auth.getSession();

    if (error) {
      console.error("Session fetch error:", error);
      window.location.href = "/login";
      return;
    }

    if (session) {
      // Store token + user info
      localStorage.setItem("authToken", session.access_token);
      localStorage.setItem("currentUser", JSON.stringify(session.user));
      window.location.href = "/";
    } else {
      console.error("No session found after redirect");
      window.location.href = "/login";
    }
  })();
</script>
</body>
</html>
