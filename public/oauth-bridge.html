<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OAuth Bridge</title>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (async () => {
    const SUPABASE_URL = "https://qhsfxcesuhbpvhquuzod.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoc2Z4Y2VzdWhicHZocXF1em9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIwNzcxNjQsImV4cCI6MjA2NzY1MzE2NH0.fS-T2lJGSpc8OWrOADjrpg8E-ZwX0AcBVxBxnrJ0KbY";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function redirectByRole(user) {
      const role = user?.role;
      if (role === "admin") {
        window.location.href = "/admin-panel";
      } else if (role === "company") {
        window.location.href = "/company-dashboard";
      } else {
        window.location.href = "/";
      }
    }

    async function handleSession(session) {
      const token = session.access_token;
      localStorage.setItem("authToken", token);
      localStorage.setItem("currentUser", JSON.stringify(session.user));
      redirectByRole(session.user);
    }

    // Listen for the auth event after redirect
    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        handleSession(session);
      } else {
        console.error("No session found after redirect");
        window.location.href = "/login";
      }
    });

    // Also try to fetch immediately in case session is ready
    const { data } = await supabase.auth.getSession();
    if (data.session) {
      handleSession(data.session);
    }
  })();
</script>
</body>
</html>
