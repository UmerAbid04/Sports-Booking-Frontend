<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>OAuth Bridge</title>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      console.log("OAuth Bridge Loaded");
      console.log("Current URL:", window.location.href);

      const SUPABASE_URL = "https://qhsfxcesuhbpvhquuzod.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoc2Z4Y2VzdWhicHVocXV1em9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIwNzcxNjQsImV4cCI6MjA2NzY1MzE2NH0.fS-T2lJGSpc8OWrOADjrpg8E-ZwX0AcBVxBxnrJ0KbY";

      // Initialize Supabase client
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      (async () => {
        try {
          // Supabase v2 automatically parses the OAuth tokens from URL hash on page load
          const { data: { session }, error } = await supabaseClient.auth.getSession();

          if (error) {
            console.error("Error getting session:", error);
          } else if (session) {
            console.log("Session retrieved successfully:", session);

            // Redirect to homepage or app dashboard
            window.location.href = "/";
          } else {
            console.log("No active session found.");
            // Optionally redirect to login page or show message
          }
        } catch (err) {
          console.error("Unexpected error:", err);
        }
      })();
    </script>
  </body>
</html>
